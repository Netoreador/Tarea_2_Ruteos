<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Yafún ante el 27F</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --fondo: #f4f1ea;
    --tinta: #1f2430;
    --suave: #6b6f7a;
    --linea: #d9d3c7;
    --acento: #b3261e;
    --azul: #24518f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Helvetica Neue", Arial, sans-serif; color: var(--tinta); }
  body { display: grid; grid-template-columns: 360px 1fr; }
  aside { background: var(--fondo); border-right: 1px solid var(--linea); overflow-y: auto; padding: 18px 18px 28px; }
  #mapa { height: 100vh; }
  .leaflet-tile-pane { filter: grayscale(1) contrast(0.9) brightness(1.05); }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.2px; }
  .sub { font-size: 12px; color: var(--suave); margin-bottom: 14px; line-height: 1.4; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--suave); margin: 18px 0 8px; border-bottom: 1px solid var(--linea); padding-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .kpi { background: #fff; border: 1px solid var(--linea); border-radius: 4px; padding: 8px 6px; text-align: center; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 10.5px; color: var(--suave); }
  .kpi.caida b { color: var(--acento); }
  .nota { font-size: 11px; color: var(--suave); margin-top: 6px; line-height: 1.4; }
  .vistas label, .capas label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 3px 2px; text-align: left; }
  th { font-weight: 600; color: var(--suave); font-size: 11px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .barra { height: 7px; background: #e6e1d6; border-radius: 2px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--azul); }
  .leyenda div { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
  .muestra { width: 28px; height: 0; border-top: 4px solid; }
  .muestra.punteada { border-top-style: dashed; }
  .nodo { width: 14px; height: 14px; border: 2px solid #1f2430; background: #fff; border-radius: 50%; }
  .nodo.genera { background: #1b7f5b; border-radius: 2px; }
  .nodo.intercambia { background: #e08e0b; transform: rotate(45deg); border-radius: 2px; width: 12px; height: 12px; }
  .icono-nodo { display: flex; align-items: center; justify-content: center; }
  .icono-epi { font-size: 30px; color: var(--acento); text-shadow: 0 0 3px #fff, 0 0 6px #fff; line-height: 30px; text-align: center; }
  .etiqueta { background: rgba(255,255,255,0.85); border: none; box-shadow: none; font-size: 11px; font-weight: 600; padding: 0 3px; }
  .etiqueta::before { display: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    #mapa { height: 55vh; grid-row: 1; }
    aside { grid-row: 2; }
  }
  body.sin-panel { grid-template-columns: 1fr; }
  body.sin-panel aside { display: none; }
</style>
</head>
<body>
<aside>
  <h1>Red Yafún ante el terremoto 27F</h1>
  <div class="sub" id="subtitulo"></div>

  <h2>ATTR entre nodos clave</h2>
  <div class="kpis">
    <div class="kpi"><b id="attr-antes"></b><span>en operación</span></div>
    <div class="kpi caida"><b id="attr-despues"></b><span>tras el sismo</span></div>
    <div class="kpi"><b id="attr-delta"></b><span>variación</span></div>
  </div>
  <div class="nota" id="nota-attr"></div>

  <h2>Vista de enlaces</h2>
  <div class="vistas">
    <label><input type="radio" name="vista" value="capa"> Red por capa (observada y sintética)</label>
    <label><input type="radio" name="vista" value="prob"> Probabilidad de falla del enlace</label>
    <label><input type="radio" name="vista" value="sim"> Simulación representativa</label>
  </div>

  <h2>Capas</h2>
  <div class="capas">
    <label><input type="checkbox" id="ver-nodos" checked> Nodos clave</label>
    <label><input type="checkbox" id="ver-epi" checked> Epicentro y distancias</label>
    <label><input type="checkbox" id="ver-mmi"> Contornos MMI del ShakeMap (USGS)</label>
  </div>

  <h2>Leyenda</h2>
  <div class="leyenda" id="leyenda"></div>

  <h2>Nodos clave tras el sismo</h2>
  <table id="tabla-nodos"></table>
  <div class="nota">P(con Santiago) es la fracción de simulaciones en que el nodo sigue conectado con Santiago.</div>

  <h2>Escenarios</h2>
  <table id="tabla-escenarios"></table>
</aside>
<div id="mapa"></div>
<script>
const D = /*DATOS*/;

const COLORES_CAPA = {
  fibra: "#24518f", postacion: "#7a8f2a", camino: "#a0703a", ferry: "#3aa0a8",
  empalme: "#b3261e", acceso: "#6d3fa0", urbano: "#d0459c"
};
const NOMBRE_CAPA = {
  fibra: "Fibra detectada (observada)", postacion: "Postación sin fibra visible", camino: "Camino sin postación",
  ferry: "Trayecto en ferry", empalme: "Empalme de hueco (<= 3 km)", acceso: "Acceso de nodo clave", urbano: "Red urbana de Santiago"
};
const CLASES_P = [
  [0, 0, "#b9bec6", "p = 0 (MMI < VI)"],
  [0, 0.01, "#9ecae1", "0 < p <= 0,01"],
  [0.01, 0.05, "#4292c6", "0,01 < p <= 0,05"],
  [0.05, 0.10, "#807dba", "0,05 < p <= 0,10"],
  [0.10, 0.20, "#c51b8a", "0,10 < p <= 0,20"],
  [0.20, 1.01, "#5a0066", "p > 0,20"]
];
const COLORES_GRUPO = ["#24518f", "#e08e0b", "#1b7f5b", "#b3261e", "#6d3fa0", "#3aa0a8", "#a0703a", "#d0459c", "#555"];

const fmt = (x, d = 3) => x.toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });

function claseP(p) {
  if (p <= 0) return CLASES_P[0];
  return CLASES_P.find(c => p > c[0] && p <= c[1]) || CLASES_P[CLASES_P.length - 1];
}

const params = new URLSearchParams(location.hash.slice(1));
if (params.get("panel") === "0") document.body.classList.add("sin-panel");

const mapa = L.map("mapa", { zoomControl: true, preferCanvas: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "&copy; OpenStreetMap"
}).addTo(mapa);
L.control.scale({ imperial: false, position: "bottomright" }).addTo(mapa);

const capaEnlaces = L.layerGroup().addTo(mapa);
const capaNodos = L.layerGroup().addTo(mapa);
const capaEpi = L.layerGroup().addTo(mapa);
const capaMmi = L.layerGroup();

function estilo(f, vista) {
  const pr = f.properties;
  const base = { weight: 2, opacity: 0.9, dashArray: pr.s ? "5 4" : null };
  if (vista === "capa") return { ...base, color: COLORES_CAPA[pr.c], weight: pr.s ? 2 : 2.6 };
  if (vista === "prob") {
    const c = claseP(pr.p);
    return { ...base, color: c[2], weight: pr.p > 0.05 ? 3.6 : pr.p > 0 ? 2.4 : 1.6 };
  }
  return pr.x ? { color: "#ff3d00", weight: 5, opacity: 1, dashArray: pr.s ? "7 5" : null } : { ...base, color: "#4f5665", weight: 1.8, opacity: 0.85 };
}

function dibujarEnlaces(vista) {
  capaEnlaces.clearLayers();
  const orden = [...D.enlaces.features].sort((a, b) => vista === "sim" ? a.properties.x - b.properties.x : a.properties.p - b.properties.p);
  L.geoJSON({ type: "FeatureCollection", features: orden }, {
    style: f => estilo(f, vista),
    onEachFeature: (f, l) => {
      const pr = f.properties;
      l.bindPopup(`<b>Enlace ${pr.id}</b> (${NOMBRE_CAPA[pr.c]}${pr.s ? ", sintético" : ""})<br>` +
        `Largo: ${fmt(pr.l, 2)} km<br>Distancia al epicentro: ${fmt(pr.d, 1)} km<br>` +
        `MMI máximo: ${fmt(pr.m, 2)} | PGV: ${fmt(pr.v, 1)} cm/s<br>` +
        `<b>p de falla: ${fmt(pr.p, 4)}</b>` + (pr.x ? "<br><b style='color:#b3261e'>Cortado en la simulación representativa</b>" : ""));
    }
  }).addTo(capaEnlaces);
  dibujarLeyenda(vista);
  dibujarNodos(vista);
}

function iconoNodo(n, vista) {
  let clase = n.genera ? "genera" : n.intercambia ? "intercambia" : "";
  let fondo = "";
  if (vista === "sim") fondo = `style="background:${COLORES_GRUPO[n.grupo % COLORES_GRUPO.length]}"`;
  return L.divIcon({ className: "icono-nodo", html: `<div class="nodo ${clase}" ${fondo}></div>`, iconSize: [16, 16] });
}

function dibujarNodos(vista) {
  capaNodos.clearLayers();
  D.nodos.forEach(n => {
    const roles = [n.genera && "genera", n.intercambia && "intercambia", n.recibe && "recibe"].filter(Boolean).join(", ");
    L.marker([n.lat, n.lon], { icon: iconoNodo(n, vista), zIndexOffset: 1000 })
      .bindTooltip(n.nombre, { permanent: true, direction: n.nombre === "Quilicura" ? "left" : "right", offset: n.nombre === "Quilicura" ? [-8, 0] : [8, 0], className: "etiqueta" })
      .bindPopup(`<b>${n.nombre}</b><br>Rol: ${roles}<br>${n.infra}<br>` +
        (n.incluir ? `Acceso a la red: ${fmt(n.km, 2)} km<br>P(conectado con Santiago): <b>${fmt(n.p_stgo, 3)}</b>` : "Fuera del ATTR"))
      .addTo(capaNodos);
  });
}

function dibujarLeyenda(vista) {
  const el = document.getElementById("leyenda");
  let html = "";
  if (vista === "capa") {
    html = Object.keys(COLORES_CAPA).map(c =>
      `<div><span class="muestra ${c === "fibra" ? "" : "punteada"}" style="border-color:${COLORES_CAPA[c]}"></span>${NOMBRE_CAPA[c]}</div>`).join("");
  } else if (vista === "prob") {
    html = CLASES_P.map(c => `<div><span class="muestra" style="border-color:${c[2]}"></span>${c[3]}</div>`).join("") +
      `<div><span class="muestra punteada" style="border-color:#555"></span>Enlace sintético (línea punteada)</div>`;
  } else {
    html = `<div><span class="muestra" style="border-color:#ff3d00"></span>Enlace cortado (${D.sim.cortados} enlaces)</div>` +
      `<div><span class="muestra" style="border-color:#4f5665"></span>Enlace operativo</div>` +
      `<div class="nota">Iteración ${D.sim.iteracion} de ${D.resumen.n_iter}, ATTR = ${fmt(D.sim.attr, 3)}. ` +
      `Los nodos del mismo color quedan en la misma componente. Los sintéticos cortados van punteados.</div>`;
  }
  html += `<div><span class="nodo genera"></span>Genera (data centers)</div>` +
    `<div><span class="nodo intercambia"></span>Intercambia (IXP o cable submarino)</div>` +
    `<div><span class="nodo"></span>Recibe (capital regional)</div>` +
    `<div><span class="icono-epi" style="font-size:18px;line-height:18px">&#10038;</span>Epicentro M${D.sismo.mag}</div>`;
  el.innerHTML = html;
}

function dibujarEpicentro() {
  const e = [D.sismo.lat, D.sismo.lon];
  L.marker(e, { icon: L.divIcon({ className: "", html: '<div class="icono-epi">&#10038;</div>', iconSize: [30, 30], iconAnchor: [15, 15] }), zIndexOffset: 2000 })
    .bindPopup(`<b>${D.sismo.titulo}</b><br>${D.sismo.fecha}<br>Profundidad ${D.sismo.prof} km<br>Evento USGS ${D.sismo.id}`)
    .addTo(capaEpi);
  [100, 250, 500].forEach(r => L.circle(e, { radius: r * 1000, color: "#b3261e", weight: 1, fill: false, dashArray: "2 6" })
    .bindTooltip(`${r} km`).addTo(capaEpi));
}

function dibujarMmi() {
  L.geoJSON(D.mmi, {
    style: f => ({ color: "#b3261e", weight: 1, opacity: 0.25 + (f.properties.mmi - 4) * 0.15 }),
    onEachFeature: (f, l) => l.bindTooltip(`MMI ${f.properties.mmi}`, { sticky: true })
  }).addTo(capaMmi);
}

function llenarPanel() {
  const r = D.resumen;
  document.getElementById("subtitulo").textContent =
    `${r.enlaces} enlaces, ${r.vertices} vértices y ${r.claves} nodos clave (${r.pares} pares). Modelo: Allen et al. (2012), Worden et al. (2012) y Hazus 4.2.`;
  document.getElementById("attr-antes").textContent = fmt(r.attr_antes, 3);
  document.getElementById("attr-despues").textContent = fmt(r.attr_despues, 3);
  document.getElementById("attr-delta").textContent = `${fmt(100 * (r.attr_despues - r.attr_antes) / r.attr_antes, 1)} %`;
  document.getElementById("nota-attr").textContent =
    `Monte Carlo con ${r.n_iter.toLocaleString("es-CL")} iteraciones (semilla ${r.semilla}), IC95 de +/- ${fmt(r.ic95, 4)}.`;
  document.getElementById("tabla-nodos").innerHTML = "<tr><th>Nodo</th><th>P(con Santiago)</th><th></th></tr>" +
    D.nodos.filter(n => n.incluir).sort((a, b) => a.p_stgo - b.p_stgo).map(n =>
      `<tr><td>${n.nombre}</td><td class="num">${fmt(n.p_stgo, 3)}</td><td style="width:38%"><div class="barra"><i style="width:${100 * n.p_stgo}%"></i></div></td></tr>`).join("");
  document.getElementById("tabla-escenarios").innerHTML = "<tr><th>Escenario</th><th>ATTR</th></tr>" +
    D.escenarios.map(e => `<tr><td>${e.nombre}</td><td class="num">${fmt(e.attr, 3)}</td></tr>`).join("");
}

llenarPanel();
dibujarEpicentro();
dibujarMmi();

const vistaInicial = params.get("vista") || "prob";
document.querySelector(`input[name=vista][value=${vistaInicial}]`).checked = true;
dibujarEnlaces(vistaInicial);
document.querySelectorAll("input[name=vista]").forEach(i => i.addEventListener("change", e => dibujarEnlaces(e.target.value)));

function alternar(id, capa) {
  const caja = document.getElementById(id);
  const aplicar = () => caja.checked ? capa.addTo(mapa) : capa.remove();
  caja.addEventListener("change", aplicar);
  return caja;
}
alternar("ver-nodos", capaNodos);
alternar("ver-epi", capaEpi);
const cajaMmi = alternar("ver-mmi", capaMmi);
if (params.get("mmi") === "1") { cajaMmi.checked = true; capaMmi.addTo(mapa); }

if (params.get("centro")) {
  const [la, lo] = params.get("centro").split(",").map(Number);
  mapa.setView([la, lo], Number(params.get("zoom") || 7));
} else {
  mapa.fitBounds([[-54.5, -75.5], [-17.8, -66.5]]);
}
</script>
</body>
</html>
